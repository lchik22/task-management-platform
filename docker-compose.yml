services:
  # Task-management service database (task_management DB). Database-per-service:
  # each service gets its own Mongo container — separate process + volume.
  mongo-task-management:
    image: mongo:7
    container_name: tmp-mongo-task-management
    restart: unless-stopped
    ports:
      - "${MONGO_TASK_MANAGEMENT_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-task_management}
    volumes:
      - mongo-task-management-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tmp-net]

  # Notifications service database (notifications DB) — its own Mongo container,
  # fully isolated from the other services' mongos (separate mongod + volume).
  mongo-notifications:
    image: mongo:7
    container_name: tmp-mongo-notifications
    restart: unless-stopped
    ports:
      - "${MONGO_NOTIFICATIONS_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${NOTIFICATIONS_DB:-notifications}
    volumes:
      - mongo-notifications-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tmp-net]

  # Identity service database (identity DB) — its own Mongo container, isolated
  # from the other services' mongos (separate mongod + volume).
  mongo-identity:
    image: mongo:7
    container_name: tmp-mongo-identity
    restart: unless-stopped
    ports:
      - "${MONGO_IDENTITY_PORT:-27019}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${IDENTITY_DB:-identity}
    volumes:
      - mongo-identity-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tmp-net]

  kafka:
    image: apache/kafka:3.9.0
    container_name: tmp-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9094,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tmp-net]

  # One-shot: pre-create the event topics so the consumer can subscribe on
  # startup. kafkajs's subscribe path does not trigger broker auto-creation,
  # so the server would otherwise crash on first boot against a fresh broker.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: tmp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in task.assigned task.status_changed project.member_added project.member_removed project.invitation_created; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        done
        echo "kafka topics ready"
    restart: "no"
    networks: [tmp-net]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tmp-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks: [tmp-net]

  task-management:
    build: ./server
    container_name: tmp-task-management
    restart: unless-stopped
    command: npm run start:task-management
    depends_on:
      mongo-task-management:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      identity:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongo-task-management:27017/${MONGO_DB:-task_management}?authSource=admin
      KAFKA_BROKERS: kafka:9094
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      JWT_SECRET: ${JWT_SECRET:-w9Xk$2!pL7&mZv@qR1!4yJ8vB5!3x%T0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      IDENTITY_URL: http://identity:3003
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    networks: [tmp-net]

  notifications:
    build: ./server
    container_name: tmp-notifications
    restart: unless-stopped
    command: npm run start:notifications
    depends_on:
      mongo-notifications:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3002
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongo-notifications:27017/${NOTIFICATIONS_DB:-notifications}?authSource=admin
      KAFKA_BROKERS: kafka:9094
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      JWT_SECRET: ${JWT_SECRET:-w9Xk$2!pL7&mZv@qR1!4yJ8vB5!3x%T0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    networks: [tmp-net]

  identity:
    build: ./server
    container_name: tmp-identity
    restart: unless-stopped
    command: npm run start:identity
    depends_on:
      mongo-identity:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3003
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongo-identity:27017/${IDENTITY_DB:-identity}?authSource=admin
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      JWT_SECRET: ${JWT_SECRET:-w9Xk$2!pL7&mZv@qR1!4yJ8vB5!3x%T0}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin!1234}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@tmp.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    networks: [tmp-net]

  gateway:
    build: ./server
    container_name: tmp-gateway
    restart: unless-stopped
    command: npm run start:gateway
    depends_on:
      task-management:
        condition: service_started
      identity:
        condition: service_started
      notifications:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      TASK_MANAGEMENT_URL: http://task-management:3001
      IDENTITY_URL: http://identity:3003
      NOTIFICATIONS_URL: http://notifications:3002
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    networks: [tmp-net]

  client:
    build: ./client
    container_name: tmp-client
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${CLIENT_PORT:-4200}:4200"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    networks: [tmp-net]

volumes:
  mongo-task-management-data:
  mongo-notifications-data:
  mongo-identity-data:
  kafka-data:
  server-node-modules:
  client-node-modules:

networks:
  tmp-net:
    driver: bridge
